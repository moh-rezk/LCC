<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al-Mosafer Smart Tool v61.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap');
:root{
  --primary:#003580;--primary-light:#1a4a9c;--secondary:#00b1ff;
  --bg:#f0f4f9;--card:#ffffff;--text-dark:#1a202c;--text-mid:#4a5568;
  --success:#16a34a;--danger:#dc2626;--warn:#d97706;
  --internal-bg:#0f172a;--internal-fg:#4ade80;
  --border:#dde3ed;--muted:#94a3b8;--accent:#e8f0fe;
}
*{box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text-dark);margin:0;padding:20px;min-height:100vh;}

/* TOP BAR */
.top-bar{
  background:linear-gradient(135deg,#003580 0%,#1a4a9c 100%);
  color:white;padding:14px 24px;border-radius:16px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;box-shadow:0 8px 24px rgba(0,53,128,.25);
}
.top-bar h1{margin:0;font-size:1.15rem;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;}
.top-bar h1 .badge{background:rgba(255,255,255,.15);font-size:.7rem;padding:2px 10px;border-radius:20px;font-weight:600;letter-spacing:.5px;}
.lang-btn{padding:6px 16px;border-radius:20px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:white;cursor:pointer;font-size:.8rem;font-family:'Cairo',sans-serif;font-weight:600;transition:.2s;}
.lang-btn:hover{background:rgba(255,255,255,.2);}
.lang-btn.active{background:white;color:var(--primary);border-color:white;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.reset-btn{padding:6px 16px;border-radius:20px;border:1.5px solid rgba(239,68,68,.5);background:rgba(239,68,68,.1);color:#fca5a5;cursor:pointer;font-size:.8rem;font-family:'Cairo',sans-serif;font-weight:600;transition:.2s;}
.reset-btn:hover{background:rgba(239,68,68,.25);}

/* LAYOUT */
.container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start;}
@media(max-width:1050px){.container{grid-template-columns:1fr;}}

/* CARDS */
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);margin-bottom:20px;border:1px solid var(--border);transition:box-shadow .2s;}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--accent);}
.card-header .icon{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.card-header h3{margin:0;color:var(--primary);font-size:.95rem;font-weight:800;}

/* FORM ELEMENTS */
label{display:block;font-weight:700;margin:12px 0 5px;font-size:.73rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-size:.88rem;font-family:'Cairo',sans-serif;transition:.2s;background:#f8fafc;color:var(--text-dark);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--secondary);box-shadow:0 0 0 3px rgba(0,177,255,.1);background:white;}
textarea{height:155px;font-family:'IBM Plex Mono',monospace;font-size:.8rem;background:#f8fafc;border-color:var(--secondary);border-width:2px;line-height:1.6;resize:vertical;}
select{cursor:pointer;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

/* FORMAT HELPER */
.fmt-helper{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border:1px solid #bfdbfe;border-radius:12px;padding:12px;margin-bottom:14px;font-size:.8rem;}
.fmt-helper summary{cursor:pointer;font-weight:700;color:var(--primary);list-style:none;display:flex;align-items:center;gap:6px;}
.fmt-helper summary::before{content:'📋';}
.fmt-tabs{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 8px;}
.fmt-tab{padding:4px 11px;border-radius:15px;border:1px solid #bfdbfe;background:white;cursor:pointer;font-size:.73rem;font-weight:700;color:var(--primary);transition:.15s;}
.fmt-tab.active,.fmt-tab:hover{background:var(--primary);color:white;border-color:var(--primary);}
.fmt-example{background:white;border:1px dashed #bfdbfe;border-radius:8px;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:.72rem;line-height:1.7;white-space:pre-wrap;display:none;color:#334155;}
.fmt-example.active{display:block;}
.use-example-btn{background:var(--primary);color:white;border:none;border-radius:7px;padding:5px 13px;cursor:pointer;font-size:.74rem;font-weight:700;margin-top:7px;font-family:'Cairo',sans-serif;transition:.2s;}
.use-example-btn:hover{background:var(--primary-light);}

/* FLIGHT CHIPS */
.parsed-flights{margin-top:10px;}
.flight-chip{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.fc-airline{background:#dbeafe;color:#1d4ed8;border-radius:6px;padding:3px 9px;font-weight:800;font-size:.73rem;}
.fc-route{font-weight:800;font-size:.9rem;color:var(--primary);}
.fc-time{color:var(--muted);font-size:.78rem;}
.fc-date{background:#fef9c3;color:#854d0e;border-radius:6px;padding:3px 9px;font-size:.73rem;font-weight:600;}
.fc-terminal{color:#7c3aed;font-size:.73rem;background:#ede9fe;border-radius:6px;padding:3px 8px;font-weight:600;}
.fc-edit{margin-right:auto;background:transparent;border:1.5px solid var(--border);border-radius:6px;padding:3px 9px;font-size:.72rem;cursor:pointer;color:var(--muted);font-family:'Cairo',sans-serif;transition:.2s;}
.fc-edit:hover{border-color:var(--secondary);color:var(--secondary);}

/* EDIT OVERLAY */
.edit-overlay{background:white;border:2px solid var(--secondary);border-radius:12px;padding:14px;margin-bottom:8px;box-shadow:0 4px 12px rgba(0,177,255,.1);}
.edit-overlay .eg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.edit-overlay label{margin:5px 0 3px;font-size:.7rem;}
.edit-overlay input{padding:7px 9px;font-size:.82rem;}
.save-btn{background:var(--success);color:white;border:none;border-radius:8px;padding:7px 16px;cursor:pointer;font-size:.78rem;font-family:'Cairo',sans-serif;font-weight:700;margin-top:8px;transition:.2s;}
.save-btn:hover{opacity:.88;}

/* OUTPUT BOXES */
.msg-box{background:#f8fafc;border:1px solid var(--border);padding:16px 18px;border-radius:12px;margin-bottom:12px;white-space:pre-wrap;line-height:1.9;font-size:.9rem;position:relative;border-right:4px solid var(--secondary);}
.msg-box::before{content:attr(data-lang);position:absolute;top:-11px;right:14px;background:var(--secondary);color:white;padding:2px 12px;border-radius:20px;font-size:.67rem;font-weight:800;letter-spacing:.3px;}
[dir="ltr"] .msg-box::before{right:auto;left:14px;}
.internal-box{background:var(--internal-bg);color:var(--internal-fg);border:none;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:.82rem;line-height:1.9;border-right:none;border-left:4px solid #4ade80;}
.internal-box::before{background:#16a34a;}

/* BUTTONS */
.btn{width:100%;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:700;margin-top:8px;font-family:'Cairo',sans-serif;font-size:.92rem;transition:.2s;letter-spacing:.2px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15);}
.btn:active{transform:translateY(0);}
.btn-success{background:linear-gradient(135deg,#16a34a,#15803d);color:white;}
.btn-main{background:linear-gradient(135deg,#003580,#1a4a9c);color:white;}
.btn-accept{background:linear-gradient(135deg,#d97706,#b45309);color:white;font-size:1rem;border-bottom:3px solid #92400e;}
.btn-dark{background:linear-gradient(135deg,#0f172a,#1e293b);color:#4ade80;font-family:'IBM Plex Mono',monospace;}

/* WAITING / STATUS */
.waiting{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1.5px dashed #fcd34d;border-radius:14px;color:#92400e;font-weight:700;font-size:.92rem;}
.waiting .w-icon{font-size:2rem;margin-bottom:8px;}
.hidden-section{display:none;margin-top:24px;border-top:2px dashed var(--border);padding-top:24px;}
hr{border:0;border-top:1px solid var(--border);margin:24px 0;}
.section-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:white;font-size:.72rem;padding:4px 14px;border-radius:20px;margin-bottom:12px;font-weight:800;letter-spacing:.3px;}
.parse-status{padding:8px 13px;border-radius:9px;font-size:.78rem;font-weight:700;margin-bottom:8px;}
.parse-ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;}
.parse-warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
.baggage-row{display:flex;gap:10px;margin-top:12px;}
.baggage-row>div{flex:1;}
</style>
</head>
<body>

<div class="top-bar">
  <h1>✈️ Al-Mosafer Smart Tool</h1>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="reset-btn" onclick="resetAll()">🔄 Reset</button>
    <button class="lang-btn active" onclick="setLang('ar')">🇸🇦 AR</button>
    <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <div class="card">
      <div class="card-header"><span>📋</span><h3 id="lbl-flight-details">1. تفاصيل الرحلة</h3></div>
      <details class="fmt-helper">
        <summary id="lbl-fmt-helper">أمثلة على صيغ شركات الطيران المدعومة</summary>
        <div class="fmt-tabs" id="fmt-tabs"></div>
        <div id="fmt-examples"></div>
      </details>
      <label id="lbl-paste">الصق نص الرحلة (أي صيغة) *</label>
      <textarea id="rawSeg" oninput="runAll()" placeholder="الصق نص الرحلة هنا — يدعم كل الصيغ..."></textarea>
      <div id="parseStatus"></div>
      <div id="parsedFlights" class="parsed-flights"></div>
      <div class="baggage-row">
        <div><label id="lbl-hand">حقيبة يد</label><input type="text" id="bHand" value="7KG" oninput="runAll()"></div>
        <div><label id="lbl-check">حقيبة شحن</label><input type="text" id="bCheck" value="20KG" oninput="runAll()"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><span>💰</span><h3 id="lbl-fees">2. الرسوم والحسابات</h3></div>
      <label id="lbl-fare">إجمالي الرسوم على موقع شركة الطيران</label>
      <input type="number" id="totalFare" placeholder="0.00" oninput="runAll()">
      <div class="grid-2" style="margin-top:8px;">
        <div>
          <label id="lbl-noshow" style="display:flex;align-items:center;gap:6px;"><span id="lbl-noshow-text">وقت النو شو</span>
            <span id="nsBadge" style="font-size:.67rem;padding:2px 9px;border-radius:12px;background:#94a3b8;color:white;font-weight:700;letter-spacing:.2px;transition:.3s;">—</span>
          </label>
          <input type="number" id="nsValue" value="90" oninput="runAll()">
        </div>
        <div><label id="lbl-nsunit">الوحدة</label>
          <select id="nsUnit" onchange="runAll()">
            <option value="min" data-ar="دقيقة" data-en="minutes">دقيقة / Minutes</option>
            <option value="hr" data-ar="ساعة" data-en="hours">ساعة / Hours</option>
          </select>
        </div>
      </div>
      <div class="grid-3" style="margin-top:8px;">
        <div><label id="lbl-pax">مسافرين</label><input type="number" id="paxCount" value="1" min="1" oninput="runAll()"></div>
        <div><label id="lbl-curr">العملة</label>
          <select id="currency" onchange="runAll()">
            <option value="SAR">SAR</option><option value="AED">AED</option>
            <option value="KWD">KWD</option><option value="EGP">EGP</option>
            <option value="USD">USD</option><option value="INR">INR</option>
          </select>
        </div>
        <div><label id="lbl-trip" style="display:flex;align-items:center;gap:6px;"><span id="lbl-trip-text">نوع الرحلة</span>
            <span id="tripBadge" style="font-size:.67rem;padding:2px 9px;border-radius:12px;background:#94a3b8;color:white;font-weight:700;letter-spacing:.2px;transition:.3s;">—</span>
          </label>
          <select id="tripType" onchange="runAll()">
            <option value="domestic">داخلية (40.25)</option>
            <option value="international">دولية (50.00)</option>
          </select>
        </div>
      </div>
      <div id="paxNamesWrap" style="margin-top:10px;"></div>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div id="waitingMsg" class="waiting"><div class="w-icon">⏳</div><span id="lbl-waiting">يرجى إدخال تفاصيل الرحلة وسعر البوابة...</span></div>
      <div id="calcResults" style="display:none;">
        <div class="section-badge" id="lbl-quote-badge">عرض السعر للعميل</div>
        <div id="quoteAr" class="msg-box" data-lang="العرض العربي"></div>
        <div id="quoteEn" class="msg-box" data-lang="English Quote" dir="ltr"></div>
        <button class="btn btn-success" onclick="copyText('quoteAr',this)" style="margin-bottom:4px;" data-ar="نسخ العرض العربي ✂️" data-en="Copy Arabic Quote ✂️">نسخ العرض العربي ✂️</button>
        <button class="btn btn-main" onclick="copyText('quoteEn',this)" style="margin-bottom:16px;" data-ar="نسخ العرض الإنجليزي ✂️" data-en="Copy English Quote ✂️">Copy English Quote ✂️</button>
        <button id="acceptBtn" class="btn btn-accept" onclick="showHiddenDetails()">✅ <span id="lbl-client-accept">العميل وافق — عرض التفاصيل الكاملة</span></button>
        <div id="detailsSection" class="hidden-section">
          <div class="section-badge">Internal Log</div>
          <div id="internalLog" class="msg-box internal-box" dir="ltr" data-lang="Internal Record"></div>
          <button class="btn btn-dark" onclick="copyText('internalLog',this)" style="margin-bottom:20px;" data-ar="📋 نسخ السجل الداخلي" data-en="📋 Copy Internal Log">📋 Copy Internal Log</button>
          <hr>
          <div class="section-badge" id="lbl-confirm-badge">التأكيد النهائي للعميل</div>
          <div id="confirmAr" class="msg-box" data-lang="تأكيد العميل (عربي)"></div>
          <button class="btn btn-success" onclick="copyText('confirmAr',this)" data-ar="نسخ التأكيد العربي ✂️" data-en="Copy Arabic Confirmation ✂️">نسخ التأكيد العربي ✂️</button>
          <div id="confirmEn" class="msg-box" data-lang="Customer Confirmation (EN)" dir="ltr" style="margin-top:16px;"></div>
          <button class="btn btn-main" onclick="copyText('confirmEn',this)" data-ar="نسخ التأكيد الإنجليزي ✂️" data-en="Copy English Confirmation ✂️">Copy English Confirmation ✂️</button>
        </div>
      </div>
    </div>
  </div>
</div>

function autoDetectTripType(flights){
  if(!flights||!flights.length)return;
  const tripEl=document.getElementById('tripType');
  const tripBadgeEl=document.getElementById('tripBadge');
  // Domestic = ALL origin & destination airports are Saudi
  const allSaudi=flights.every(f=>saudiAirports.has(f.fromCode)&&saudiAirports.has(f.toCode));
  const hasUnknown=flights.some(f=>f.fromCode==='??'||f.toCode==='??');
  if(hasUnknown)return; // can't determine, leave as-is
  tripEl.value=allSaudi?'domestic':'international';
  if(tripBadgeEl){
    tripBadgeEl.textContent=allSaudi?'✅ داخلية':'✅ دولية';
    tripBadgeEl.style.background=allSaudi?'#16a34a':'#003580';
  }
}

function applyNoShowRule(airlineCode){
  const rule=noShowMap[airlineCode];
  if(!rule)return;
  const nsValueEl=document.getElementById('nsValue');
  const nsUnitEl=document.getElementById('nsUnit');
  const nsBadgeEl=document.getElementById('nsBadge');

  // Check for minutes (e.g. "90 Mins")
  const minsMatch=rule.match(/^(\d+)\s*mins?/i);
  if(minsMatch){
    nsValueEl.value=parseInt(minsMatch[1]);
    nsUnitEl.value='min';
    if(nsBadgeEl){nsBadgeEl.textContent='✅ '+airlineCode+' ('+rule+')';nsBadgeEl.style.background='#d97706';}
    return;
  }
  // Simple numeric hours (e.g. "24", "3", "1")
  const simpleNum=rule.match(/^(\d+)$/);
  if(simpleNum){
    nsValueEl.value=parseInt(simpleNum[1]);
    nsUnitEl.value='hr';
    if(nsBadgeEl){nsBadgeEl.textContent='✅ '+airlineCode;nsBadgeEl.style.background='#16a34a';}
    return;
  }
  // Complex / "Check Rules" — show badge warning, leave field as-is
  if(nsBadgeEl){
    nsBadgeEl.textContent='⚠️ '+airlineCode+': '+rule;
    nsBadgeEl.style.background='#d97706';
  }
}

function numToMon(n){return['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][n-1]||'JAN';}

function parseTime(h,m,ap){
  let hr=parseInt(h,10);const mi=String(m).padStart(2,'0');
  const a=(ap||'').toLowerCase().trim();
  if((a==='pm'||a==='م'||a==='مساءً')&&hr<12)hr+=12;
  if((a==='am'||a==='ص'||a==='صباحاً')&&hr===12)hr=0;
  return String(hr).padStart(2,'0')+':'+mi;
}

function extractTimes(text){
  const res=[];
  const re=/(\d{1,2}):(\d{2})(?:\s*(AM|PM|صباحاً|مساءً|ص|م))?/gi;
  let m;
  while((m=re.exec(text))!==null)res.push(parseTime(m[1],m[2],m[3]));
  if(res.length===0){
    const re2=/\b([01]\d|2[0-3])([0-5]\d)\b/g;
    while((m=re2.exec(text))!==null)res.push(m[1]+':'+m[2]);
  }
  return res;
}

function extractDate(text){
  const yr=new Date().getFullYear().toString();
  let dm;
  // 1) 25 April 2026
  dm=text.match(/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\s+(\d{4})/);
  if(dm){const mo=monthMapEn[dm[2].toLowerCase()]||dm[2].substring(0,3).toUpperCase();return{day:dm[1].padStart(2,'0'),mon:mo,year:dm[3]};}
  // 2) Arabic: 25 أبريل 2026
  for(const[k,v]of Object.entries(monthMapAr)){const re=new RegExp('(\\d{1,2})\\s+'+k+'(?:\\s+(\\d{4}))?');const am=text.match(re);if(am)return{day:am[1].padStart(2,'0'),mon:v,year:am[2]||yr};}
  // 3) DD/MM/YYYY
  dm=text.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(dm)return{day:dm[1].padStart(2,'0'),mon:numToMon(parseInt(dm[2])),year:dm[3]};
  // 4) GDS: 25APR or 25APR26
  dm=text.match(/\b(\d{2})(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)(\d{2,4})?\b/i);
  if(dm){const y=dm[3]?(dm[3].length===2?'20'+dm[3]:dm[3]):yr;return{day:dm[1],mon:dm[2].toUpperCase(),year:y};}
  // 5) April 25, 2026
  dm=text.match(/([A-Za-z]{3,})\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/);
  if(dm)return{day:dm[2].padStart(2,'0'),mon:monthMapEn[dm[1].toLowerCase()]||dm[1].substring(0,3).toUpperCase(),year:dm[3]};
  return{day:'??',mon:'???',year:yr};
}

function extractAirline(text){
  // Match known codes with flight number
  const re=/\b([A-Z0-9]{2})\s?[-]?\s?(\d{2,4})\b/g;
  let m;
  while((m=re.exec(text))!==null){
    const code=m[1].toUpperCase();
    if(airDB[code])return{code,num:m[2]};
  }
  // Match known code without number
  const allCodes=Object.keys(airDB).sort((a,b)=>b.length-a.length).join('|');
  const re2=new RegExp('\\b('+allCodes+')\\b','i');
  const m2=text.match(re2);
  if(m2){
    const code=m2[1].toUpperCase();
    const nm=text.match(new RegExp(m2[1]+'[\\s\\-]?(\\d{2,4})','i'));
    return{code,num:nm?nm[1]:''};
  }
  return{code:'??',num:''};
}

function extractAirports(text){
  const hits=[];
  // Priority 1: (XXX) in parens
  const re1=/\(([A-Z]{3})\)/g;let m;
  while((m=re1.exec(text))!==null)if(airportMap[m[1]])hits.push({code:m[1],idx:m.index});
  // Priority 2: bare code
  if(hits.length<2){
    const re2=/\b([A-Z]{3})\b/g;
    while((m=re2.exec(text))!==null)if(airportMap[m[1]]&&!hits.find(h=>h.code===m[1]))hits.push({code:m[1],idx:m.index});
  }
  hits.sort((a,b)=>a.idx-b.idx);
  const seen=new Set();
  return hits.filter(h=>{if(seen.has(h.code))return false;seen.add(h.code);return true;});
}

function extractTerminals(text){
  const parts=text.split(/\b(arrival|arr|وصول|الوصول)\b/i);
  const depB=parts[0],arrB=parts.length>1?parts.slice(2).join(''):'';
  const re=/(?:terminal|صالة|term)[.\s\-:–]*([A-Z]?\d+)/gi;
  function find(b){const m=re.exec(b);re.lastIndex=0;return m?m[1].replace(/^T/i,''):'';}
  return{dep:find(depB),arr:find(arrB)};
}

function parseSeg(text){
  const airports=extractAirports(text);
  if(airports.length<2)return null;
  const fromCode=airports[0].code,toCode=airports[1].code;
  const airline=extractAirline(text);
  const times=extractTimes(text);
  const d=extractDate(text);
  const terms=extractTerminals(text);
  const dateAr=d.day!=='??'?`${parseInt(d.day)} ${monthAr[d.mon]||d.mon} ${d.year}`:'??';
  const dateEn=d.day!=='??'?`${parseInt(d.day)} ${d.mon} ${d.year}`:'??';
  return{
    fromCode,toCode,
    fromAr:airportMap[fromCode]?.ar||fromCode,fromEn:airportMap[fromCode]?.en||fromCode,
    toAr:airportMap[toCode]?.ar||toCode,toEn:airportMap[toCode]?.en||toCode,
    time:times[0]||'??:??',arrTime:times[1]||'??:??',
    day:d.day,mon:d.mon,year:d.year,dateAr,dateEn,
    airlineCode:airline.code,flightNum:airline.num,
    airlineAr:airDB[airline.code]?.ar||airline.code,
    airlineEn:airDB[airline.code]?.en||airline.code,
    terminal:terms.dep?'T'+terms.dep:'',arrTerminal:terms.arr?'T'+terms.arr:'',
    stopover:false,layoverAr:'',layoverEn:''
  };
}

function smartExtract(text){
  // Split by flight headers or multiple flight numbers
  let segs=[];
  const hRe=/\b(departure\s+flight|return\s+flight|outbound|inbound|رحلة\s+الذهاب|رحلة\s+العودة)\b/gi;
  const hM=[...text.matchAll(hRe)];
  if(hM.length>=2){segs=hM.map((h,i)=>text.slice(h.index,i+1<hM.length?hM[i+1].index:text.length));}
  else{
    const fnRe=/\b([A-Z0-9]{2})\s?[-]?\s?(\d{2,4})\b/g;
    const fns=[...text.matchAll(fnRe)].filter(m=>airDB[m[1].toUpperCase()]);
    const uniq=[...new Set(fns.map(m=>m[1].toUpperCase()+m[2]))];
    if(uniq.length>=2){
      let last=0;
      fns.filter((m,i,a)=>i===0||m[1].toUpperCase()+m[2]!==a[i-1][1].toUpperCase()+a[i-1][2])
        .forEach((fm,i,a)=>{if(i>0){segs.push(text.slice(last,fm.index));last=fm.index;}});
      segs.push(text.slice(last));
    }
  }
  if(segs.length===0)segs=[text];
  const flights=segs.map(s=>parseSeg(s.trim())).filter(Boolean);
  return flights.length?flights:[parseSeg(text)].filter(Boolean);
}

function to12En(t){if(!t||t==='??:??')return t;const[h,m]=t.split(':');let hr=parseInt(h);const p=hr>=12?'PM':'AM';if(hr===0)hr=12;else if(hr>12)hr-=12;return`${hr}:${m} ${p}`;}
function to12Ar(t){if(!t||t==='??:??')return t;const[h,m]=t.split(':');let hr=parseInt(h);const p=hr>=12?'م':'ص';if(hr===0)hr=12;else if(hr>12)hr-=12;return`${hr}:${m} ${p}`;}

  document.getElementById('confirmAr').innerText=`للتأكيد فقط، هذه هى الرحلة المطلوبة، صحيح؟\n${paxLineAr}\n${sAr}الأمتعة: ${bH} يد / ${bC} مشحون\n\n${legAr}`;

// ══════════════════════════════════════════════════════════════════
//  AI TRANSLATE — uses Claude API (works inside claude.ai artifact)
// ══════════════════════════════════════════════════════════════════
window.aiTranslate=async function(){
  const raw=document.getElementById('rawSeg').value.trim();
  if(!raw){document.getElementById('aiStatus').textContent=currentLang==='ar'?'⚠️ الرجاء إدخال نص أولاً':'⚠️ Please enter text first';return;}
  const btn=document.getElementById('aiParseBtnLabel');
  const status=document.getElementById('aiStatus');
  btn.textContent=currentLang==='ar'?'⏳ جاري التحليل...':'⏳ Analysing...';
  status.innerHTML='<span style="color:var(--muted);">🔄 Connecting to AI...</span>';

  const prompt=`You are an expert flight data extractor. Extract ALL flight legs (including each leg of connecting flights separately).
Return ONLY a raw JSON array — no markdown, no explanation. Start with [ end with ].
Each object must have EXACTLY these keys:
{"fromCode":"RUH","toCode":"HYD","fromAr":"الرياض","fromEn":"Riyadh","toAr":"حيدراباد","toEn":"Hyderabad","time":"17:10","arrTime":"00:40","day":"02","mon":"MAY","year":"2026","dateAr":"2 مايو 2026","dateEn":"02 MAY 2026","airlineCode":"6E","flightNum":"94","airlineAr":"إنديغو","airlineEn":"IndiGo","terminal":"T5","arrTerminal":"","stopover":false,"layoverAr":"","layoverEn":""}
Rules: time/arrTime in 24h HH:MM. stopover=true for legs that are layovers. layoverAr/layoverEn = duration string or "". year=2026 if not stated.
Flight text:\n${raw}`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){const t=await res.text();throw new Error(`HTTP ${res.status}: ${t.substring(0,200)}`);}
    const data=await res.json();
    if(data.error)throw new Error(data.error.message||'API error');
    const text=(data.content||[]).map(c=>c.type==='text'?c.text:'').join('').trim();
    const match=text.match(/\[[\s\S]*\]/);
    if(!match)throw new Error('No JSON found. Response: '+text.substring(0,300));
    const flights=JSON.parse(match[0]);
    if(!Array.isArray(flights)||!flights.length)throw new Error('Empty result');
    parsedFlightsData=flights;
    renderFlightChips(flights);
    status.innerHTML=`<span style="color:var(--success);">✅ ${currentLang==='ar'?`تم استخراج ${flights.length} رحلة بالذكاء الاصطناعي`:`${flights.length} leg(s) extracted by AI`}</span>`;
    const fare=parseFloat(document.getElementById('totalFare').value)||0;
    if(fare>0){document.getElementById('waitingMsg').style.display='none';document.getElementById('calcResults').style.display='block';buildOutputs();}
    else{document.getElementById('waitingMsg').style.display='block';document.getElementById('calcResults').style.display='none';}
  }catch(e){
    console.error('AI error:',e);
    status.innerHTML=`<span style="color:var(--danger);">❌ ${e.message||'Failed'}</span>`;
  }
  btn.textContent=currentLang==='ar'?'تحليل وترجمة بالذكاء الاصطناعي':'AI Translate & Analyse';
};
